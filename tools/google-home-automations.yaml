# Google Home automations for the YTM Trigger schedule
#
# GENERATED from tools/schedule-blocks.mjs - the same file the app config and
# the Schedule tab come from. Regenerate rather than editing by hand:
#   node tools/google-home-automations.mjs > google-home-automations.yaml
#
# Paste into the script editor at https://home.google.com/automations
# (Public Preview). Replace every occurrence of:
#   SPEAKER NAME - ROOM
# with the speaker exactly as the Home app names it, including the room.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE TURNING THEM ON
#
# Shabat and Yom Tov. Google Home has no Jewish calendar and no way to
# express one. These automations run on weekdays only, so they will not fire
# on Shabat - but they WILL fire on Yom Tov, including the ones that fall on
# a Sunday to Thursday. You have to turn them off for a festival yourself.
# The erev Shabat and motzaei Shabat blocks are deliberately NOT generated:
# their times depend on nightfall and on whether a festival runs into Shabat,
# which only the app works out.
#
# Your own playlists probably will not work. Google's documentation says an
# Assistant action needing Voice Match or personal results does not run in a
# household automation, and a personal YouTube Music playlist is exactly
# that. Named podcasts are public and should be fine. Each automation below
# therefore asks for a show the sheet records as having actually played on
# your old Assistant routines, not a playlist.
#
# One show, not a queue. A Home automation issues a single command. The app
# plays a queue of a dozen shows, picks the episode, skips one it cannot
# finish, resumes what was cut off and moves on when a stream dies. None of
# that exists here: this starts one show at the right time and stops at the
# end of the block.
#
# PASTE ONE AT A TIME. The script editor takes a single automation per
# script - one metadata block and one automations block. Each numbered
# section below is its own script; create a new automation for each and
# paste only that section.
#
# Do not run these and the app at once on the same speaker. They will talk
# over each other. Use these only if the phone is out of action, or point
# them at a speaker the phone does not drive.
# ---------------------------------------------------------------------------

# ===== 1. A Morning Launch ==================================
# UNVERIFIED: "TorahAnytime Daily Dose" is not recorded as having played on a speaker.
# Say "Hey Google, play TorahAnytime Daily Dose" once and check it resolves.
metadata:
  name: A Morning Launch
  description: Morning Launch, 07:30 – 08:00. Generated from schedule-blocks.mjs.
automations:
  starters:
  - type: time.schedule
    at: 07:30
    weekdays:
    - SUN
    - MON
    - TUE
    - WED
    - THU
  actions:
  - type: assistant.command.OkGoogle
    okGoogle: Play TorahAnytime Daily Dose on SPEAKER NAME
    devices: SPEAKER NAME - ROOM

# ===== 2. A Morning Launch - stop ===========================
metadata:
  name: A Morning Launch - stop
  description: Ends the block at 08:00, as the app does.
automations:
  starters:
  - type: time.schedule
    at: 08:00
    weekdays:
    - SUN
    - MON
    - TUE
    - WED
    - THU
  actions:
  - type: assistant.command.OkGoogle
    okGoogle: Stop
    devices: SPEAKER NAME - ROOM

